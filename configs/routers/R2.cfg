enable
configure terminal
hostname R2
no ip domain-lookup
interface gigabitEthernet0/0
 description LAN_TO_SW2
 ip address 192.168.20.1 255.255.255.0
 no shutdown
exit
interface gigabitEthernet0/1
 description WAN_TO_R1
 ip address 10.0.12.2 255.255.255.252
 no shutdown
exit
interface gigabitEthernet0/2
 description WAN_TO_R3
 ip address 10.0.23.1 255.255.255.252
 no shutdown
exit
ip dhcp excluded-address 192.168.20.1 192.168.20.20
ip dhcp pool SITE2_LAN
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 192.168.20.10
 domain-name practice.lab
exit
ip route 192.168.10.0 255.255.255.0 10.0.12.1
ip route 192.168.10.0 255.255.255.0 10.0.23.2 10
ip route 192.168.30.0 255.255.255.0 10.0.23.2
ip route 192.168.30.0 255.255.255.0 10.0.12.1 10
end
copy running-config startup-config

